name: sheikhy_app
description: "Sheikhy — white-label single-sheikh Islamic education app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.4

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Functional error handling
  dartz: ^0.10.1

  # Navigation
  go_router: ^15.1.2

  # Video
  youtube_player_iframe: ^5.1.1

  # Audio
  just_audio: ^0.10.4
  audio_session: ^0.2.2
  dio: ^5.8.0+1
  path_provider: ^2.1.5

  # PDF
  pdfx: ^2.9.2
  pdf: ^3.11.3
  printing: ^5.14.2

  # Charts & Heatmap
  fl_chart: ^0.70.2
  flutter_heatmap_calendar: ^1.0.5

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Connectivity & Prefs
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3

  # Formatting
  intl: ^0.20.2

  # Utilities
  url_launcher: ^6.3.1
  carousel_slider: ^5.0.0
  permission_handler: ^12.0.0+1

  # Fonts
  google_fonts: ^6.2.1

  # Optional: FCM (comment out if not using FCM yet)
  # firebase_core: ^3.12.1
  # firebase_messaging: ^15.2.5

  # Code generation (runtime)
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Logging
  logging: ^1.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
